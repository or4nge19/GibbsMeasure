      lean: "MeasureTheory.GibbsMeasure.Markov.transferSpecification"
      module: "GibbsMeasure/Model/BoundaryLaw.lean"
      status: "proved"
      note: >-
        S = Z, E countable, counting measure as a priori measure. A positive matrix Q with finite
        powers (IsTransferMatrix, (11.1)) is the kernel Kernel.ofMatrix Q; gamma^Q is the
        lambda-specification of counting measure with the bond weights prod Q(sigma_j, sigma_{j+1})
        over the bonds meeting Lambda, a pre-modification (1.28)(5). (11.2) is
        transferSpecification_Icc_apply_intervalCylinder, with the partition function of an
        interval an entry of a power of Q (sigmaFiniteLambdaZ_transferWeight_Icc); (11.3) is
        transferSpecification_apply_cyl_union for volumes with disjoint bond sets. Georgii (1.33)
        for the lambda-specification of a sigma-finite a priori measure
        (Specification.lambdaSpecification_isGibbsMeasure_iff_forall_singleton_bind_eq) is the
        general tool.
    - source: "Remark (11.4), display (11.5)"
      lean: "MeasureTheory.GibbsMeasure.Markov.transferSpecification_eq_iff"
      module: "GibbsMeasure/Model/BoundaryLaw.lean"
      status: "proved"
      note: >-
        gamma^P = gamma^Q iff P(x,y) = Q(x,y) r(y) / (q r(x)) for a constant q in (0, infinity) and
        a function r : E -> (0, infinity). Both directions, by Georgii's argument through the
        singleton kernels.
    - source: "Definition (11.8), boundary laws"
      lean: "MeasureTheory.GibbsMeasure.Markov.IsBoundaryLaw"
      module: "GibbsMeasure/Model/BoundaryLaw.lean"
      status: "proved"
      note: >-
        Families l_i, r_i of positive finite row and column vectors with l_i Q = l_{i+1},
        Q r_i = r_{i-1} and l_i r_i = 1: the row vectors are the measures l_i . count acting on the
        kernel ofMatrix Q by Measure.bind, the column vectors are integrated against it.
    - source: "Theorem (11.9)(a), display (11.10)"
      lean: "MeasureTheory.GibbsMeasure.Markov.isGibbsMeasure_transferSpecification_boundaryLawMeasure"
      module: "GibbsMeasure/Model/BoundaryLaw.lean"
      status: "proved"
      note: >-
        The probability measure with the cylinder probabilities (11.10)
        (boundaryLawMeasure, by Kolmogorov's extension theorem; boundaryLawMeasure_intervalCylinder
        is (11.10) and eq_boundaryLawMeasure_of_forall_intervalCylinder its uniqueness) is a Gibbs
        measure for gamma^Q. Chapter 3 is the finite-state instance:
        markovSpecification_eq_transferSpecification and stationaryChain_eq_boundaryLawMeasure
        (Q = P stochastic, l_i = alpha_P, r_i = 1). (11.9)(b), the converse for shift-invariant
        Gibbs measures, and (11.11)-(11.19) are not formalized.
    - source: "Proposition (9.1), hypothesis (9.2)"
      lean: "MeasureTheory.GibbsMeasure.IsSymmetryDominated.measurePreserving"
      module: "GibbsMeasure/Specification/SymmetryInheritance.lean"
      status: "proved"
      note: >-
        IsSymmetryDominated gamma tau a b is (9.2): for every local event A there is a volume
        Lambda with gamma_Lambda(A | .) <= a gamma_Lambda(tau^{-1} A | .) + b gamma_Lambda(tau A | .).
        For a tau-invariant gamma every mu in G(gamma) is tau-invariant. The extreme case
        (map_eq_of_mem_extremePoints) needs only Countable S, through (7.7)(d); the general case
        reduces to it by the extreme decomposition (7.26)/(7.28), hence StandardBorelSpace E.
    - source: "Theorem (9.3): localized versions of a symmetry"
      lean: "MeasureTheory.GibbsMeasure.measurePreserving_gibbsSpecificationOfSigmaFiniteAdmissible_of_isLocalizedVersion"
      module: "GibbsMeasure/Specification/SymmetryInheritance.lean"
      status: "proved"
      note: >-
        Transformation.IsLocalizedVersion tau' tau Delta Lambda is (9.3)(i) on configurations.
        For a sigma-finite lambda, a lambda-admissible Phi, a lambda-preserving tau with
        tau Phi = Phi and 0 <= c <= 1: if every Delta admits a localized version tau' with
        beta (c H_Lambda(tau' .) + (1 - c) H_Lambda(tau'^{-1} .) - H_Lambda) <= C, every Gibbs
        measure for gamma^{beta Phi} is tau-invariant. Georgii's Delta subset Lambda is not used.
        Variants for finite reference measures and absolutely summable potentials. On the way:
        (5.5), (5.6), (5.9)(b) over a sigma-finite a priori measure, Remark (1.28)(2), pure-spin
        transformations (9.9), pair potentials (9.10).
    - source: "Theorem (9.11), display (9.12)"
      lean: "MeasureTheory.GibbsMeasure.measurePreserving_of_pairDefectBound_ne_top"
      module: "GibbsMeasure/Model/OneDimensionalSymmetry.lean"
      status: "proved"
      note: >-
        Any locally finite linear order with predecessors as site set (Z and N), a pair potential
        (9.10) that is IsSummable (Georgii's (2.2), not absolute summability), beta >= 0, a
        lambda-preserving pure-spin symmetry of the pair interaction, and the defect bound (9.12)
        sup_n sum_{i <= n < j} J(i, j) < infinity with J the pair defect: every Gibbs measure is
        tau-invariant.
    - source: "Corollary (9.16), non-existence for a dissipative symmetry"
      lean: "MeasureTheory.GibbsMeasure.G_eq_empty_of_pairDefectBound_ne_top_of_dissipative"
      module: "GibbsMeasure/Model/OneDimensionalSymmetry.lean"
      status: "proved"
      note: >-
        Under the hypotheses of (9.11), if some bounded measurable f with lambda(f) > 0 satisfies
        f(tau_i^k x) -> 0 lambda-a.e., then G(gamma) is empty.
    - source: "Theorem (9.5), display (9.6); Example (9.8)(1)"
      lean: "MeasureTheory.GibbsMeasure.measurePreserving_shift_of_shiftDefect_ne_top"
      module: "GibbsMeasure/Model/OneDimensionalSymmetry.lean"
      status: "proved"
      note: >-
        Shift-invariant pair potentials on Z (9.4) with lambda finite and Phi absolutely summable:
        if sum_k k |phi_{k+p} - phi_k| < infinity (shiftDefect phi p) then every Gibbs measure is
        invariant under the shift by p, by Georgii's cyclic rotation of [m, n] (localizedShift)
        and Theorem (9.3). Second half of (9.7)(2) (shiftDefect_mul_le); the long-range Ising
        interaction phi_k = -beta k^{-a} s(x) s(y), a > 1, is shift-invariant
        (measurePreserving_shift_longRangeIsing). Not formalized: (9.7)(1), (9.7)(3), the first
        half of (9.7)(2), (9.8)(2), (9.13), (9.15), (9.17), and Section 9.2 (Mermin-Wagner).
    - source: "Theorem (14.10), Corollary (14.11)"
      lean: "MeasureTheory.GibbsMeasure.ergodicDecomposition_invariantFields"
      module: "GibbsMeasure/Specification/InvariantDecomposition.lean"
      status: "proved"
      note: >-
        A (P_Theta, I)-kernel exists for the shift group of a countable abelian site group with an
        increasing regular Foelner sequence (exists_isPAKernel_invariantFields_shiftGroup; Z^d with
        the cubes [0,n)^d), built from the individual ergodic theorem (14.A8) on a countable
        generating class and Mathlib's kernelOfMeasurableRat. Given such a kernel, for any countable
        Theta: ex P_Theta nonempty, unique extreme decomposition, mu -> w_mu an affine bijection,
        w_mu = image of mu under the kernel, and w_mu(nu(A) <= c) = mu(mu(A|I) <= c). (14.11) for
        tau in the normaliser of Theta (weight_map_of_mem_normalizer). The extreme-decomposition
        package is abstracted over IsPAKernel P A pi (namespace IsPAKernel), so that (7.26)-(7.30)
        and (14.10) are one theorem.
    - source: "Theorem (14.17), Corollary (14.18), Corollary (14.25)"
      lean: "MeasureTheory.GibbsMeasure.ergodicDecomposition_invariantG"
      module: "GibbsMeasure/Specification/InvariantDecomposition.lean"
      status: "proved"
      note: >-
        For Theta moving every finite volume off itself (hypothesis of (14.9)): the kernel of
        (14.10) is a (G_Theta(gamma), I)-kernel, w_mu is carried by ex G_Theta(gamma), unique
        decomposition within G_Theta(gamma); (14.18) linear independence counts ex G_Theta(gamma);
        (14.25) for quasilocal gamma: G_Theta(gamma) is the closed convex hull of any L with
        ex G_Theta(gamma) subset L subset G_Theta(gamma) — the inclusion ex G_Theta(gamma) subset
        G_{Theta,lim}(gamma) is (14.20)(c). (14.13), (14.16) and (14.21)-(14.24) are not formalized
        as separate statements.
    - source: "Theorem (14.20)"
      lean: "MeasureTheory.GibbsMeasure.ae_tendsto_shiftAverage_withLocalConvergence_cube"
      module: "GibbsMeasure/Specification/ErgodicGibbsLimits.lean"
      status: "proved"
      note: >-
        (a) for any measure-preserving action along an increasing regular Foelner sequence, then
        for the shift group; (b) weak convergence of the shift averages of gamma_Lambda for compact
        metrizable E and shift-invariant gamma; (c) convergence in the topology of local
        convergence for a lambda-modification of the independent specification of a probability
        measure lambda, with the coupling hypothesis |{i in F_n : delta - i not in Lambda_n}| / |F_n|
        -> 0 in place of Georgii's |Lambda_n minus Lambda'_n| / |Lambda_n| -> 0; cubes of Z^d as the
        instance. Georgii applies Lemma (14.19) to the unbounded averages of rho_Delta, whose
        maximal function need not be integrable; the proof here truncates at M, passes to the
        limit in M, and closes with a one-sided Scheffe lemma.
    - source: "Section 10.1: Definitions (10.2), (10.4), (10.6)-(10.8), (10.10); Example (10.3); Theorem (10.9); Example (10.11)"
      lean: "MeasureTheory.GibbsMeasure.Markov.isOneSidedMarkov_iff_isGlobalMarkov"
      module: "GibbsMeasure/Specification/MarkovInt.lean"
      status: "proved"
      note: >-
        S = Z, E any measurable space. Markov specifications and Markovian densities (10.2), with
        the lambda-specification of a Markovian pre-modification Markov; the chain specification
        of transition densities (10.3) (chainSpecification; Georgii's fallback rho = g_{i,k-1} on
        {Z = 0} for non-admissible densities is not formalized); Markov chains (10.4) with (10.5)
        as an iff for probability kernels; the two-sided, one-sided, local and global Markov
        properties; Theorem (10.9): Markov field iff locally Markov, left iff right iff globally
        Markov, one-sided implies two-sided, Markov chains are one-sided; Example (10.11): a Markov
        chain with transition densities p_j is a Gibbs measure for the chain specification.
        Chapter 3's gamma_P and mu_P are instances (Model/MarkovChainInt.lean). Sections 10.2-10.3
        are not formalized.
    - source: "Section 15.3: (15.22)-(15.25), Theorem (15.30)(a); Proposition (16.1)(a)"
      lean: "Potential.tendsto_logZ_div_card_pressure"
      module: "GibbsMeasure/Specification/Pressure.lean"
      status: "proved"
      note: >-
        S = Z^d, lambda a probability measure on E, Phi shift-invariant and absolutely summable.
        Energy density f_Phi and specific energy mu(f_Phi); the boundary estimate (15.25) with the
        explicit bound sum over A meeting Lambda and not contained in it; (15.23) both limits for
        mu in P_Theta; the pressure P(Phi) = lim |Lambda_n|^{-1} log Z_{Lambda_n}(omega_n) for every
        choice of boundary conditions, along any boxes with all side lengths -> infinity, via (15.11)
        applied to log sup_omega Z_Lambda + tail(Lambda); |P(Phi)| <= ||Phi||_0; Lipschitz
        continuity and convexity of P (Georgii (16.1)(a)) by Hoelder. The entropy-side statements
        (15.28), (15.30)(b), (15.32)-(15.35) need the specific entropy (15.12), in flight.
    - source: "Theorem (7.26), (7.28)-(7.30) and Theorem (14.10), (14.17) share one proof"
      lean: "IsPAKernel.exists_unique_weight_extremePoints"
      module: "GibbsMeasure/Specification/PAKernel.lean"
      status: "proved"
      note: >-
        The extreme decomposition governed by a (P, A)-kernel (Georgii's Theorem (7.26) proof) is
        stated once for any IsPAKernel P A pi with ex P = P cap trivialOn A and P measurable;
        Chapter 7 is the instance P = G(gamma), A = tail, Chapter 14 the instance P = P_Theta or
        G_Theta(gamma), A = I.
    - source: "Theorem (9.20), Mermin-Wagner; Lemmas (9.28), (9.33); decay condition (9.21)"
      lean: "MeasureTheory.GibbsMeasure.measurePreserving_of_logDecay"
      module: "GibbsMeasure/Model/MerminWagner.lean"
      status: "proved"
      note: >-
        Any countable linearly ordered site set with a planar norm (finite balls, shells of size
        <= c_0 (n+1)); Z^2 with the maximum norm is the instance (as the lexicographic product
        Z x_l Z, because Potential.pair needs a linear order on the sites). E standard Borel,
        lambda sigma-finite, any real beta, a summable lambda-admissible pair potential, a
        one-parameter group of lambda-preserving pure-spin symmetries with u -> phi_ij(x, tau^u_j y)
        C^2 and beta times its second derivative <= J(i,j), J symmetric with the decay condition
        (9.21): every Gibbs measure is invariant under every tau^u. (9.28) is proved on the
        partial sums of the Hamiltonian; (9.33) with the explicit bound
        1096 c_0 (N+1)^2 K / log(1+L), splitting the pairs at d(i,j) <= (|i|-N)^3 (Georgii splits
        at the square; the cubic split is what the tail estimate used here supports). The
        plane-rotator and Heisenberg instances (9.22)-(9.24) are not formalized.
    - source: "Theorem (11.9)(b), (11.11)-(11.12), (11.13) sufficiency, (11.15) extreme case, (11.16)"
      lean: "MeasureTheory.GibbsMeasure.Markov.IsMarkovChain.exists_isBoundaryLaw_eq_boundaryLawMeasure"
      module: "GibbsMeasure/Model/BoundaryLawUniqueness.lean"
      status: "proved"
      note: >-
        Every Markov chain in G(gamma^Q) is the measure of a boundary law, with the transition
        kernels P_i(x,y) r_{i-1}(x) = Q(x,y) r_i(y) (11.11); (11.12) in division-free form; if
        Q ~ P with P stochastic with an invariant probability vector then mu_P in G_Theta(gamma^Q);
        (11.16); (11.15) for a boundary-law measure extreme in G(gamma^Q): theta_p mu = mu when
        inf_x Q^p(x,x) > 0, and theta_{N!} mu = mu under Georgii's hypothesis on sum_{n<=N} Q^n(x,x).
        Not formalized: (11.9)(c) (needs (10.21)), the uniqueness half of (11.13) and (11.14),
        (11.17), the conclusions of (11.18) and (11.19) (need (11.6)-(11.7): the convergence
        parameter L(Q) and recurrence theory, absent from Mathlib), (11.18)(2) (comparison with
        (8.39)).
    - source: "Comments (9.7), Example (9.8)(2), Comments (9.13), Examples (9.15), (9.17)"
      lean: "MeasureTheory.GibbsMeasure.G_gradientPotential_eq_empty"
      module: "GibbsMeasure/Model/OneDimensionalSymmetryExamples.lean"
      status: "proved"
      note: >-
        (9.7)(1)-(3) with the quantitative form K_p(recentred phi) <= 2 Delta(Phi); (9.8)(2) with
        the (20.21) input (a Gibbs measure of the long-range Ising interaction breaking the spin
        flip) as an explicit hypothesis; (9.13)(1)-(3) with the constant C <= 2 (9.14);
        (9.15) with the existence of mu_+ with positive magnetisation as a hypothesis (Theorem
        (6.4), Section 6.1, is not formalized); (9.17) for any additive group E with a
        translation-invariant sigma-finite lambda, Gaussian instances on R and Z; u = beta |x|^p,
        0 < p < 2, not formalized.
    - source: "Proposition (15.10), Theorem (15.12), Definition (15.13), Proposition (15.14)(a)-(b)"
      lean: "MeasureTheory.GibbsMeasure.tendsto_entropyIn_div_card"
      module: "GibbsMeasure/Specification/SpecificEntropy.lean"
      status: "proved"
      note: >-
        Relative entropy on F_Lambda is klDiv of the trimmed measures (relativeEntropyIn, any
        Lambda subset S); strong subadditivity for arbitrary Lambda, Delta via the chain rule and
        the Markov property of independent sigma-algebras; specific entropy in EReal (values in
        [-infinity, 0]; -infinity is a genuine case) as the infimum over boxes, with convergence
        along any boxes with all side lengths -> infinity for mu in P_Theta; affine on P_Theta (needs
        d >= 1, which Georgii leaves implicit: on Z^0 the specific entropy is strictly concave);
        upper semicontinuous on all of P(Omega) in the topology of local convergence. Not
        formalized: compactness of {k >= c} for standard Borel E ((15.14)(c)), (15.16)-(15.20).
        lambda is a probability measure (Georgii's finite lambda is normalised, as he does himself).
    - source: "Display (11.6), Proposition (11.7): the convergence parameter and recurrence"
      lean: "ProbabilityTheory.Kernel.eq_of_apply_eq_mul_div_of_isRecurrent_of_convergenceNorm_eq_one"
      module: "GibbsMeasure/Mathlib/Probability/Kernel/CountableMatrix/Recurrence.lean"
      status: "proved"
      note: >-
        Mathlib-layer recurrence theory for kernels on a countable state space: L(Q) as the limit
        of Q^n(x,x)^{1/n} (Fekete), independent of x for positive Q, Cauchy-Hadamard for the
        diagonal series; the Green kernel, recurrence/transience as a dichotomy for irreducible
        kernels (Mathlib's phi-irreducibility with counting measure), positive recurrence as
        recurrence plus an invariant probability; (11.7) in all three parts for P(x,y) = Q(x,y)
        r(y)/(q r(x)) with L(P) = L(Q) = 1, the recurrent case through the Liouville property of an
        irreducible recurrent kernel rather than Georgii's hitting times. Not formalized: the
        first-passage characterisations (Mathlib has hitting times and Ionescu-Tulcea but no
        strong Markov property or renewal decomposition), and Vere-Jones' theorem (cited, not used).
    - source: "Section 12.1: (12.1)-(12.2), (12.7)-(12.13), (12.14)-(12.17)"
      lean: "MeasureTheory.GibbsMeasure.Tree.IsBoundaryLaw.isGibbsMeasure_transferSpecification_boundaryLawMeasure"
      module: "GibbsMeasure/Model/TreeBoundaryLaw.lean"
      status: "proved"
      note: >-
        Any locally finite graph for the definitions, a tree for the theorems; E countable with
        counting measure; Georgii's finite E enters only as finiteness of the partition functions
        and of the boundary-law mass, both automatic for finite E. gamma^Q as the
        lambda-specification of the bond weights, Markov; boundary laws indexed by oriented edges;
        Theorem (12.12)(a) (the measure by Kolmogorov extension with (12.13), in G(gamma^Q), a
        Markov chain) and (b) (every Markov chain in G(gamma^Q) comes from a boundary law); (12.11)
        Chapter 11 boundary laws are boundary laws on the Hasse graph of Z; (12.15) and the
        constant case (12.16)-(12.17). Not formalized: (12.3)(2)-(6), (12.5), (12.6), uniqueness of
        the boundary law up to a factor, (12.18). The counting-kernel and cylinder lemmas live once in
        Specification/CountingKernel.lean for any site set; Chapter 11's gamma^Q is the Hasse-graph
        instance of the tree specification (transferSpecification_eq_transferSpecification_hasse_int),
        with (11.1) giving the tree admissibility.
    - source: "Section 10.2: (10.12)-(10.20), Theorem (10.21), Corollary (10.22)"
      lean: "MeasureTheory.GibbsMeasure.Markov.exists_isMarkovChain_of_mem_extremePoints"
      module: "GibbsMeasure/Specification/MarkovIntChains.lean"
      status: "proved"
      note: >-
        Marginal densities and local absolute continuity (10.12)-(10.16), the backward martingale
        (10.17)-(10.18), Lemma (10.20) in Georgii's three-part form, Theorem (10.21) for any
        measurable E (only tail triviality (7.7)(a) is used), Corollary (10.22) with
