automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Mathematical direction and architecture by the project lead: choice of results and of the
        order in which to attack them, the design of the Lean ontology (specifications as proper
        consistent kernel families, potentials, the topology of local convergence, the space of
        absolutely summable potentials), the standard applied to every result (general theorem
        first, Mathlib-native definitions, no proof obligations stored in structures, no parallel
        theory to Mathlib, no weakened surrogates), adversarial reviewing of every landed chapter
        against Georgii, and all integration and commits.
    - method: "agent"
      models: ["claude-fable-5", "claude-opus-5"]
      framework: "Claude Code"
      tool_setup: >-
        Multi-agent orchestration under the project lead's direction. Worker agents drafted and
        compiled Lean against the built library in scratch files; adversarial reviewer agents
        checked statements against the source text and against Mathlib and compiled falsifications
        of weakened hypotheses. Grounding was provided by Axiomatic AI tooling (proprietary, in
        part unreleased): a structured, section-level rendering of the source text
        (`reference_docs`), a concept wiki cross-linking each notion to its Lean declarations
        (`reference_wiki`, whose `lean_refs` are maintained as results land), and a Lean search
        facility (`search_lean`) used to locate existing Mathlib API and avoid duplication.
      prompting_notes: >-
        Standing instructions: prefer the general theorem to the special case; build a missing
        prerequisite rather than weaken a statement; never record a gap in place of closing it;
        verify every statement against the source before proving it.
  notes: >-
    The formalization is directed and owned by the project lead; agents are an execution and
    review instrument within that direction. Chapters 1-2's specification core is earlier,
    foundational work by Yael Dillies.

fidelity:
  divergences: >-
    No known weakening. Corollary (7.30) is now proved at Georgii's own hypotheses — a standard
    Borel state space and a quasilocal lambda-specification over a sigma-finite non-zero a priori
    measure (`Specification/ExtremeCorollaries.lean`,
    `setOf_mem_GP_eq_closure_convexCombosLimitGibbs_lambdaSpecification`, with the
    modification-of-isssd form alongside it); the finite-state-space statement
    `setOf_mem_GP_eq_closure_convexCombosLimitGibbs` remains for an arbitrary quasilocal
    specification. Every restriction that remained after the main development has
    been either removed or identified as one of Georgii's own hypotheses:
    (a) reference measures — the sigma-finite case is now covered by his rescaling Remark
    (1.28)(3) (`Specification/Rescaling.lean`, `Potential/FiniteReference.lean`). Two apparent
    restrictions turned out to be intrinsic rather than weakenings: the independent specification
    `isssd` requires a probability measure because for lambda(E) != 1 the consistency equation is
    false outright (testing with f = 1 forces lambda(E)^|Lambda| = 1, and Georgii's (1.26) claims
    consistency only for disjoint volumes), and the finiteness of lambda in Theorem (4.23) is
    Georgii's own hypothesis, since his (2.14) shows a potential in B is lambda-admissible exactly
    when lambda is finite.
    (b) Proposition (4.15) now assumes nothing about the state space, via Georgii's Radon-Nikodym
    seed algebra.
    (c) Theorem (7.12)(b), weak convergence, assumes a compact metrizable state space — that is
    Georgii's own hypothesis in (7.12)(b) ("if E is a compact metric space"), not a restriction
    added here; parts (a) and (c) are proved at his hypotheses too, (a) over an arbitrary
    measurable state space.
    (d) The critical inverse temperature beta_c is defined, with 1/4 <= beta_c <= log 3, and BOTH
    halves are now unconditional: uniqueness for every 0 <= beta < beta_c and non-uniqueness for
    every beta_c < beta (`Model/SharpCriticalTemperature.lean`, `ising_sharp_phase_transition`).
    The Lebowitz-Martin-Loef/Ruelle equivalence |G(beta Phi)| > 1 <-> mu_plus(sigma_0) > 0, which
    Georgii cites without proving it, is proved here (`Model/LebowitzMartinLof.lean`,
    `nontrivial_GP_ising2D_iff_spontaneousMagnetisation_pos`), so the upward-closedness of the
    non-uniqueness set is a theorem (`isUpperSet_isingNonUniqueness`) rather than a hypothesis.
    Nothing is asserted at beta = beta_c. Onsager's exact value of beta_c is not proved here;
    Georgii states it in the remarks after (6.9), beta_c = 1/2 log(1 + sqrt 2), without proof.
    (e) Theorem (8.39) is proved in full at Georgii's own hypotheses: Definition (2.2)
    summability rather than absolute summability, and both S = Z and S = N (through an abstraction
    of the one-dimensional input, `HasBoundedBoundary`). The uniqueness half holds over any
    sigma-finite non-zero lambda-admissible a priori measure; the existence half, following
    Georgii's own reduction, holds over the same sigma-finite non-zero lambda, on a standard Borel
    state space, exactly as he states it. (His own (4.23) assumes lambda finite; (8.39) reaches
    the sigma-finite case because the measures exp(-beta Phi_{i}) lambda produced by the reduction
    are finite, which is how it is done here.) The reduction itself is formalized: §2.4 (equivalence of potentials), the recentred many-body part and its
    absolute summability under (8.40), the transport into the per-site a priori measures
    lambda_i = exp(-beta Phi_{i}) lambda, and (4.23)(a) over such a family.
  notes: >-
    Two differences from the book are deliberate improvements. Lemma (6.14) is proved by an
    explicit Z/2 coboundary argument, including the case n_c(u) = 4 where Georgii appeals to the
    Jordan curve theorem; the Lean proof uses no topology, which matters because the Jordan curve
    theorem is not available in Mathlib. In Theorem (6.9), mu_plus is obtained as a cluster point
    of cube-averaged plus-boundary distributions, which is Georgii's own construction. Separately,
    `Model/PlusPhase.lean` builds the plus state as a genuine monotone LIMIT of the finite-volume
    distributions with all-plus boundary condition — via Holley's inequality, which gives
    stochastic monotonicity in the boundary condition and hence antitonicity in the volume — and
    proves the sandwich mu_minus <= mu <= mu_plus for every Gibbs measure. That is the route
    Georgii describes only in his surrounding remarks, citing other papers, and it is what makes
    the Lebowitz-Martin-Loef equivalence available. The equivalence is proved without any coupling
    theorem: two stochastically comparable finite measures of equal mass that agree on a family of
    measurable upper sets generating the sigma-algebra are equal, because the family of upper sets
    on which they agree is closed under intersection
    (`Mathlib/MeasureTheory/Order/StochasticDomination.lean`). Strassen's theorem is neither used
    nor present in Mathlib.

review:
  status: "agent-reviewed"
  notes: >-
    Each landed chapter was checked by adversarial reviewer agents against the book text and
    Mathlib, verifying statement fidelity, absence of vacuity (by instantiating hypotheses at
    concrete models and by compiling falsifications of weakened hypotheses), axiom cleanliness,
    and duplication against Mathlib. No human expert review has taken place.

