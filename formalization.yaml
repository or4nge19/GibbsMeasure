    recorded in fidelity.divergences. Chapters 9-20 are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "MeasureTheory.GibbsMeasure.Peierls.exists_two_shiftInvariant_gibbs"
      file: "GibbsMeasure/Model/PhaseTransition.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Comparator/config.json"
    - declaration: "MeasureTheory.GibbsMeasure.Peierls.tendsto_localDistSet_shiftInvariantGibbs_dirac"
      file: "GibbsMeasure/Model/LowTemperatureLimit.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "MeasureTheory.GibbsMeasure.ising_two_dimensional_phase_transition"
      file: "GibbsMeasure/Model/CriticalTemperature.lean"
      sorry_count: 0
