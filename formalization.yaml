        additive site group, any exhausting net of torus reductions, and any set I of periodizable
        lambda-preserving symmetries; Z^d with Theta <= I <= T_lambda^(m) o R o Theta is the
        instance (mem_GP_and_measurePreserving_of_mapClusterPt_latticePeriodic). Phi is taken in
        B, the Gibbsian specification the tree has, rather than "finite range or B".
    - source: "Section 15.1, relative entropy (15.1)-(15.7)"
      lean: "InformationTheory.tendsto_klDiv_trim"
      module: "GibbsMeasure/Mathlib/InformationTheory/RelativeEntropy.lean"
      status: "proved"
      note: >-
        Georgii's H_A(mu|nu) is Mathlib's klDiv (mu.trim) (nu.trim) and psi (15.4) is klFun;
        no Georgii-named definition. (15.2) and (15.5)(a)-(c) are Mathlib or one-liners;
        genuinely new: joint convexity klDiv_smul_add_smul_le, (15.6) monotone convergence along
        an increasing sequence of sigma-algebras (Levy upward + Fatou, with a set-approximation
        argument replacing Georgii's uniform-integrability step in the non-absolutely-continuous
        case), and (15.7) as a supremum over finite partitions via the countably-generated
        reduction. Sequences rather than nets, since Mathlib's martingale convergence is N-indexed.
    - source: "Lemma (15.11), the d-dimensional subadditive limit"
      lean: "BoxSubadditive.tendsto_div_card"
      module: "GibbsMeasure/Mathlib/Analysis/Subadditive/Cubes.lean"
      status: "proved"
      note: >-
        Fekete's lemma on boxes of Z^d: a translation-invariant function on boxes, subadditive on
        disjoint unions that are boxes, has lim |Lambda_n|^{-1} a(Lambda_n) = inf over boxes along
        cubes with |Lambda_n| -> infinity, via the tiling lemma. Mathlib has only the 1D
        Subadditive.tendsto_lim. Prerequisite of (15.12) and (15.30).
    - source: "Lemma (14.19), dominated convergence for reversed martingales"
      lean: "MeasureTheory.tendsto_ae_condExp_of_antitone_of_dominated"
      module: "GibbsMeasure/Mathlib/Probability/Martingale/DominatedBackward.lean"
      status: "proved"
      note: >-
        For a finite measure, a decreasing sequence of sub-sigma-algebras and f_n -> F a.e. with
        |f_n| <= g integrable: E[f_n | A_n] -> E[F | inf A_n] a.e., via the tree's Levy downward
        theorem and a new a.e. monotone convergence theorem for condExp
        (tendsto_ae_condExp_of_monotone, sigma-finite trim, no finiteness). The liminf and limsup
        halves are separate lemmas.
    - source: "Theorem (14.12), dense extreme boundary of P_Theta"
      lean: "MeasureTheory.GibbsMeasure.closure_setOf_mem_extremePoints_invariantFields_shiftGroup"
      module: "GibbsMeasure/Specification/ErgodicDense.lean"
      status: "proved"
      note: >-
        Georgii's periodised product mu_n and its shift average v_n, for a countable infinite
        abelian site group with a sequence of tilings (C_n, H_n) — C_n a set of representatives
        of the subgroup H_n — whose boundary fractions vanish; the cubes of Z^d are the instance.
        Ergodicity of v_n uses (14.9) and tail triviality of the tile product. No ergodic theorem
        is used.
    - source: "Theorems (14.A3), (14.A5): the L2 and L1 mean ergodic theorems"
      lean: "MeasureTheory.tendsto_integral_norm_inv_card_smul_sum_sub_condExp"
      module: "GibbsMeasure/Mathlib/Dynamics/Ergodic/MeanErgodic.lean"
      status: "proved"
      note: >-
        For any group acting by measure-preserving maps and any Foelner net of finsets (left
        translates), the averages R_F f converge to E[f | I] in L2 (no finiteness of mu needed;
        limit condExpL2 in Lp) and in L1 (finite mu). Proved by adapting the strategy of Mathlib's
        single-operator von Neumann theorem (fixed space + closure of coboundaries), not Georgii's
        minimal-norm argument. Countability of the group is genuinely needed to identify the fixed
        space of the Koopman operators with the I-measurable functions (counterexample recorded).
        Additive (Z^d) versions transported through Multiplicative G.
    - source: "Lemma (14.A6), the ergodic maximal inequality"
      lean: "MeasureTheory.measure_exists_lt_abs_div_card_le_cube"
      module: "GibbsMeasure/Mathlib/Dynamics/Ergodic/MaximalInequality.lean"
      status: "proved"
      note: >-
        Georgii's statement mu(sup_n |R_n f| > c) <= 3^d mu(|f|)/c for an increasing sequence of
        cubes in Z^d, as the instance of an abstract Tempelman-type inequality
        (mul_measure_lt_ergodicMaximalFunction_le): a sequence of finite sets each containing 0
        with an "enlargement" swallowing every intersecting lower-rank translate, constant
        |enlargement|/|F_n|; for increasing F_n the enlargement F_n - F_n + F_n works. The
        greedy Vitali selection is Finset.exists_subset_pairwiseDisjoint_subset_biUnion, a corollary of
        Mathlib's Vitali.exists_disjoint_subfamily_covering_enlargement. No
        countability of the group, no finiteness of mu, f measurable rather than integrable.
    - source: "Proposition (14.9), display (14.14), Theorem (14.15)"
      lean: "MeasureTheory.GibbsMeasure.extremePoints_invariantG"
      module: "GibbsMeasure/Specification/ErgodicGibbs.lean"
      status: "proved"
      note: >-
        (14.9): the invariant sigma-algebra is contained in the tail sigma-algebra mod mu, for any
        group of transformations that moves every finite volume off itself (shift group on an
        infinite site group; any group containing a shift of infinite order). (14.14):
        invariantG = G(gamma) inter P_Theta. (14.15)(c) is proved first — invariantG is a face of
        P_Theta — and (a), ex G_Theta = G_Theta inter ex P_Theta, follows as Georgii remarks;
        (b) via the a.s.-invariant sigma-algebra of the kernels. No shift-invariance of gamma is
        consumed by the proofs; no standard Borel assumption anywhere.
    - source: "Theorem (14.5)(b)-(d), Remark (14.3), Definition (14.6)"
      lean: "MeasureTheory.GibbsMeasure.mem_invariantFields_iff_exists_withDensity"
      module: "GibbsMeasure/Specification/Ergodicity.lean"
      status: "proved"
      note: >-
        For any countable subgroup of the transformation group, as Georgii's footnote licenses,
        not only the shift group. The general facts live in the Mathlib layer
