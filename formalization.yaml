      status: "proved"
    - source: "Theorem (6.9), first assertion"
      lean: "MeasureTheory.GibbsMeasure.Peierls.tendsto_localDistSet_shiftInvariantGibbs_dirac"
      module: "GibbsMeasure/Model/LowTemperatureLimit.lean"
      status: "proved"
    - source: "Theorem (6.9), second assertion"
      lean: "MeasureTheory.GibbsMeasure.Peierls.exists_two_shiftInvariant_gibbs"
      module: "GibbsMeasure/Model/PhaseTransition.lean"
      status: "proved"
    - source: "Theorem (7.26)"
      lean: "MeasureTheory.GibbsMeasure.exists_unique_weight_extremePoints"
      module: "GibbsMeasure/Specification/ExtremeDecomposition.lean"
      status: "proved"
    - source: "Theorem (8.7)"
      lean: "MeasureTheory.GibbsMeasure.Dobrushin.existsUnique_mem_GP_of_isDobrushin_of_standardBorel"
      module: "GibbsMeasure/Specification/DobrushinUniqueness.lean"
      status: "proved"
    - source: "Theorem (8.20)"
      lean: "MeasureTheory.GibbsMeasure.Dobrushin.comparison"
      module: "GibbsMeasure/Specification/DobrushinUniqueness.lean"
      status: "proved"
    - source: "Proposition (8.38)"
      lean: "MeasureTheory.GibbsMeasure.subsingleton_G_of_isUniformlyDominated"
      module: "GibbsMeasure/Specification/OneDimensionalUniqueness.lean"
      status: "proved"
    - source: "Theorem (8.39), first half"
      lean: "MeasureTheory.GibbsMeasure.subsingleton_G_lambdaSpecification_of_iSup_oscSpan_ne_top"
      module: "GibbsMeasure/Specification/OneDimensionalUniqueness.lean"
      status: "proved"
    - source: "Theorem (8.39), second half"
      lean: >-
        MeasureTheory.GibbsMeasure.existsUnique_mem_GP_lambdaSpecification_of_iSup_oscSpan_ne_top
      module: "GibbsMeasure/Specification/OneDimensionalUniqueness.lean"
      status: "proved"
      note: >-
        Existence follows Georgii's reduction: `isAbsolutelySummable_centre_manyBody` puts the
        recentred many-body part in B under (8.40), and
        `Potential.GP_lambdaSpecification_nonempty` absorbs the self-energies into per-site a
        priori measures. `existsUnique_mem_GP_of_iSup_oscSpan_ne_top` is the special case of an
        absolutely summable potential, where existence is (4.23)(a) directly.
    - source: "Theorem (4.23)(a) over per-site a priori measures"
      lean: "Potential.GP_gibbsSpecificationFamily_nonempty"
      module: "GibbsMeasure/Potential/PerSiteExistence.lean"
      status: "proved"
    - source: "Theorem (7.12)(c)"
      lean: "MeasureTheory.GibbsMeasure.ae_tendsto_iSup_ofReal_abs_sub_of_mem_extremePoints_G"
      module: "GibbsMeasure/Specification/UniformLocalLimits.lean"
