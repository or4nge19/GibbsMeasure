      lean: "MeasureTheory.GibbsMeasure.exists_isGibbsMeasure_shift_and_siteEquiv_invariant"
      module: "GibbsMeasure/Specification/InvariantExistenceGroup.lean"
      status: "proved"
      note: >-
        Georgii's reflection group R is finite but does not commute modulo the shifts, so this is
        branch (i) of (5.15), not (ii): the invariant weight is the uniform measure on a finite
        group (Mathlib's uniformOn Set.univ, shown left invariant). Stated for an arbitrary additive site group and an
