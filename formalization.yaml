    - source: "Section 6.1: (6.2)-(6.3), (6.5)-(6.6), Theorem (6.4) in both directions, Comment (6.7)(2)"
      lean: "MeasureTheory.GibbsMeasure.exists_G_isingChainSpecification_eq"
      module: "GibbsMeasure/Model/InhomogeneousIsingChain.lean"
      status: "proved"
      note: >-
        S = N, E = Bool with the uniform spin measure, the chain as Potential.pair. Under (6.1):
        mu_+ and mu_- = tau mu_+ with positive/negative magnetisation at every site, and
        G(gamma) = [mu_-, mu_+] (both inclusions; the interval as ENNReal-weighted combinations);
        if (6.1) fails, |G(gamma)| = 1 ((6.7)(2)). Not formalized: (6.7)(1), (6.7)(3). The
