        eq_of_forall_measurableSet_invariants_eq, exists_measurableSet_invariants_eq_one_eq_zero)
        for a countable group acting measurably on any measurable space. (14.5)(d) is singularity
        on the invariant sigma-algebra, as Georgii states it. Georgii's shift group is shiftGroup.
    - source: "Theorem (5.15)(ii)"
      lean: "MeasureTheory.GibbsMeasure.exists_mem_GP_and_forall_measurePreserving_sup_of_commute_mod_of_measurePreserving"
