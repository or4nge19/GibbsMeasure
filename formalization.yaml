      module: "GibbsMeasure/Model/ShiftAverage.lean"
      status: "proved"
      note: >-
        Free boundary conditions. Gibbs half from Example (4.20)(1), symmetry half from
        Proposition (5.18) with the one-element volume family R_n = {Delta_n}, whose Foelner ratio
        is zero. The missing ingredient was that truncation transports,
        Potential.map_truncation.
    - source: "Example (5.20)(3)"
      lean: "MeasureTheory.GibbsMeasure.mem_GP_and_measurePreserving_of_mapClusterPt_periodicModification"
      module: "GibbsMeasure/Model/PeriodicSymmetry.lean"
      status: "proved"
      note: >-
        Periodic boundary conditions. The Gibbs half is Example (4.20)(2); the symmetry half needs
        Georgii's periodic modification tau_N of a transformation (Potential.periodize), the
        identity sigma-tilde o tau_N = tau o sigma-tilde, the tau_N-invariance of the periodic
