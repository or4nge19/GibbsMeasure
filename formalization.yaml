    - source: "Lemma (15.28), Theorem (15.30)(b), (15.32)-(15.35), Theorem (15.37), Theorem (15.39)"
      lean: "Potential.specificRelativeEntropy_eq_zero_iff_mem_invariantG"
      module: "GibbsMeasure/Specification/VariationalPrinciple.lean"
      status: "proved"
      note: >-
        (15.28) quantitatively and as stated; (15.30)(b) for mu in P_Theta and any Gibbs rho
