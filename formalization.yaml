    - source: "Ergodic decomposition of Gibbs measures via the tail kernel"
      lean: "MeasureTheory.GibbsMeasure.ae_mem_extremePoints_G_tailKernel"
      module: "GibbsMeasure/Specification/ErgodicDecomposition.lean"
      status: "vacuous-hypothesis"
      note: >-
        These statements assume CountableOrCountablyGenerated of the TAIL sigma-algebra on E^S,
        which is false for countably infinite S and 2 <= #E (the tail atoms are the E_0 classes, so
        a countable generator would make E_0 smooth). They are therefore vacuous in Georgii's
        setting. The same applies to the TailTrivialCore / LawLevelExtremal / ChoquetDecomposition
        sections of Specification/ChoquetLaw.lean. Nothing else depends on them: (7.26), the
        non-emptiness of ex G(gamma) and its measurability are proved unconditionally by the
        (7.22)/(7.25) route in ExtremeDecomposition.lean and ExtremeCorollaries.lean, and the
        pointwise conclusion is ae_mem_extremePoints_G_gibbsKernel, which assumes no countable
        generation. Fixing the tail-kernel versions requires replacing the tail sigma-algebra by a
        countably generated one equal to it modulo mu-null sets; such a sigma-algebra always
        exists (L^1 of a standard Borel space is separable, hence so is the L^1 of any
        sub-sigma-algebra); that lemma is now in the tree
        (MeasureTheory.exists_countablyGenerated_le_ae, Mathlib/MeasureTheory/Measure/
        CountablyGeneratedModNull.lean, at SFinite generality) and it still does not help, because
        the approximating set depends on the event; the impossibility is the theorem
        MeasureTheory.GibbsMeasure.not_ae_forall_tailKernel_apply_eq_indicator
        (Blackwell-Dubins, Specification/NoProperTailKernel.lean).
