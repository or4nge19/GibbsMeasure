    - source: "Pullback of a potential along a map of the single-spin space; Example (9.15) from Theorem (6.4)"
      lean: "MeasureTheory.GibbsMeasure.exists_not_measurePreserving_squareFlip₁_of_summable"
      module: "GibbsMeasure/Specification/Pullback.lean"
      status: "proved"
      note: >-
        Potential.comap f Phi; for f = Prod.fst the Gibbs specification of the pullback over
        nu_1 x nu_2 is gamma^Phi tensor the independent specification of nu_2, and mu -> mu^1 maps
