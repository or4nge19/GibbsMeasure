    - declaration: "MeasureTheory.GibbsMeasure.Dobrushin.existsUnique_mem_GP_of_isDobrushin_of_standardBorel"
      file: "GibbsMeasure/Specification/DobrushinUniqueness.lean"
      sorry_count: 0
