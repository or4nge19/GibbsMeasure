# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "GibbsMeasure"
  description: >-
    A formalization of the theory of Gibbs measures on infinite-volume lattice systems following
    Georgii, Gibbs Measures and Phase Transitions (2nd ed.). Specifications and the DLR equations;
    the Gibbs representation theorem (2.30); existence, compactness and semicontinuity of the set
    of Gibbs measures over the Frechet space of absolutely summable potentials (4.22)-(4.23); the
    extreme decomposition, tail triviality and the simplex structure (7.7), (7.12), (7.26),
    (7.28)-(7.30); transformations and invariant Gibbs measures (Chapter 5); Dobrushin's
    uniqueness theory including the comparison theorem (8.20) and (8.7)-(8.8); the one-dimensional
    Markov chain classification (3.5); and the two-dimensional Ising phase transition (6.9) in
    both of its assertions, giving two-sided bounds on the critical temperature.
  authors:
    - "Matteo Cipollina"        # project lead: mathematical direction, architecture, review, integration
    - "Yael Dillies"            # original specification/DLR core (Chapters 1-2)
  responsible_maintainers:
    - "Matteo Cipollina"
  license: "Apache-2.0"

sources:
  - title: "Gibbs Measures and Phase Transitions, 2nd edition"
    authors: ["Hans-Otto Georgii"]
    id: "ISBN 978-3-11-025029-9; de Gruyter Studies in Mathematics 9"
    type: "book"
    location: "Chapters 1-8 (principally 2.30, 3.5, 4.15-4.23, 5.1-5.20, 6.9, 7.7-7.30, 8.5-8.23)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/RemyDegenne/kolmogorov_extension4"
    note: "Kolmogorov extension; material was ported into GibbsMeasure/Mathlib/MeasureTheory."
  - id: "https://github.com/or4nge19/MCMC"
    note: >-
      Perron-Frobenius theory for positive/irreducible matrices. This project proves only the
      strictly positive case it needs (Collatz-Wielandt); MCMC has the fuller development.

classification:
  arxiv: ["math.PR", "math-ph", "math.DS"]
  msc2020: ["82B20", "60K35", "82B05", "37D35"]

