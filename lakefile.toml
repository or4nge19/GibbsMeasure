name = "GibbsMeasure"
keywords = ["math", "probability", "measure-theory", "statistical-physics", "percolation", "ising-model"]
defaultTargets = ["GibbsMeasure"]

[leanOptions]
# Pretty-prints `fun a ↦ b`
pp.unicode.fun = true
# Don't assume a typo is a new variable
autoImplicit = false
relaxedAutoImplicit = false
# Enable all mathlib linters: automatically matches what mathlib uses...
weak.linter.mathlibStandardSet = true
# ...except the header linter.
weak.linter.style.header = false

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "GibbsMeasure"

# Statements for the `comparator` proof judge (https://github.com/leanprover/comparator).
# Not in `defaultTargets`: built explicitly by `lake build Comparator`, which is also what
# `comparator` itself invokes, module by module.
#
# `warn.sorry` is switched off HERE ONLY. The challenge files are 61 deliberate holes, so the
# warning is noise in this library — but leaving it off globally, as it used to be, meant a
# `sorry` accidentally introduced into `GibbsMeasure/` would have been silent. It is now an
# error there.
[[lean_lib]]
name = "Comparator"
globs = ["Comparator.+"]
leanOptions = { warn.sorry = false }
