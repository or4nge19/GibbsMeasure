name: Comparator

# Independently re-checks every entry of the comparator suite with
# https://github.com/leanprover/comparator. For each `Comparator/config*.json`, the challenge
# states the theorems with `sorry`, the solution states them identically and proves them from the
# library, and comparator confirms — via `lean4export` and a kernel replay inside a `landrun`
# sandbox — that the exported statements match, that no axiom beyond `propext` / `Quot.sound` /
# `Classical.choice` is used, and that the kernel accepts the proofs. `enable_nanoda` in each
# config asks for a second, independent kernel replay, so `nanoda_bin` must be on `PATH`.
#
# Linux only: `landrun` is built on the kernel's Landlock LSM, which does not exist on macOS.
# That is why this check lives in CI rather than in a developer's local loop.

on:
  push:
    branches: [mc3, main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_unhardened:
        description: >-
          Run even if the systemd AF_UNIX restriction cannot be applied. Off by default: without
          it the sandbox is weaker than comparator's README prescribes, so the result is not a
          full adversarial check.
        type: boolean
        default: false

jobs:
  comparator:
    name: Judge every comparator entry
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout GibbsMeasure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: GibbsMeasure

      - name: Checkout comparator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: leanprover/comparator
          # Pinned: an unpinned judge is a mutable link in the trust chain. Bump deliberately.
          ref: 2312244ac716564a61cc0bf4e107d9abf1757a61
          path: comparator

      # `lean4export` must match the toolchain in `lean-toolchain`; the tag below is exactly
      # `leanprover/lean4:v4.34.0-rc2`, the toolchain this repository pins.
      - name: Checkout lean4export
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: leanprover/lean4export
          # Tag v4.34.0-rc2, resolved to its commit: a tag can be moved, a SHA cannot.
          ref: cacf989bd75f608700820f6afc595f32e7a99a4d
          path: lean4export

      - name: Checkout landrun
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Zouuup/landrun
          # Pinned; `main` is mutable and this is the sandbox the whole check rests on.
          ref: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          path: landrun

      - name: Checkout nanoda
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ammkrn/nanoda_lib
          ref: 05055695879dfebb6628a67da88ceca6cd6b0421
          path: nanoda_lib

      # Every `Comparator/config*.json` sets `enable_nanoda: true`, which makes comparator replay
      # the export through a second, independent kernel. Without `nanoda_bin` on `PATH` that
      # request cannot be honoured, so this step is not optional given those configs.
      - name: Build nanoda
        working-directory: nanoda_lib
        run: cargo build --release

      # landrun requires Go >= 1.24 (see its README).
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # landrun's go.mod requires 1.24.0; pin rather than track `stable`.
          go-version: '1.24.0'
          cache-dependency-path: landrun/go.sum

      - name: Build landrun
        working-directory: landrun
        run: go build -o landrun cmd/landrun/main.go

      # Installs elan + the toolchain from GibbsMeasure/lean-toolchain, runs `lake exe cache get`
      # and `lake build`. Pre-building matters: comparator rebuilds `Comparator.Challenge` and
      # `Comparator.Solution` inside the landrun sandbox, and only those two modules should be
      # left to build there. Note `Comparator` is not in `defaultTargets`, so this step builds
      # the development itself, not the challenge.
      - name: Build GibbsMeasure
        uses: leanprover/lean-action@f807b338d95de7813c5c50d018f1c23c9b93b4ec # v1.2.0
        with:
          lake-package-directory: GibbsMeasure
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"

      # Two gates the sandboxed comparator run does NOT provide.
      #
      # (a) An all-solutions build. comparator compiles one challenge/solution pair per config
      #     inside the sandbox; nothing otherwise checks that every Solution module still
      #     compiles together against the library. `lake build Comparator` does, and it is not a
      #     default target, so without this step a broken solution could sit unnoticed until the
      #     entry naming it happened to run.
      #
      # (b) A hard sorry gate. warn.sorry is off for the Comparator library only, where the 61
      #     holes are deliberate. Everywhere else a sorry is a warning, and warnings do not fail
      #     a build, so grep for it directly.
      - name: Build every challenge and solution, and gate on sorry
        working-directory: GibbsMeasure
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build Comparator

          if grep -rnE '\bsorry\b' GibbsMeasure/ --include='*.lean'; then
            echo "::error::sorry found in the library; permitted only in Comparator challenge files."
            exit 1
          fi
          for f in Comparator/Solution*.lean Comparator/Defs*.lean; do
            if grep -nE '\bsorry\b' "$f"; then
              echo "::error::sorry in $f -- only Challenge files may contain one."
              exit 1
            fi
          done
          echo "no sorry outside Comparator/Challenge*.lean"

      - name: Build lean4export
        working-directory: lean4export
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

      - name: Build comparator
        working-directory: comparator
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

      # Every entry, not just the flagship: the workflow iterates over every
      # `Comparator/config*.json`, so a new entry is judged with no workflow change.
      # `fail-fast` is off in spirit — the loop records each failure and exits
      # non-zero at the end, so one bad entry does not hide the status of the others.
      - name: Run comparator on every entry
        working-directory: GibbsMeasure
        run: |
          set -uo pipefail
          # comparator looks up `landrun`, `lean4export` and `nanoda_bin` on PATH (or via
          # COMPARATOR_LANDRUN / COMPARATOR_LEAN4EXPORT / COMPARATOR_NANODA), and shells out to
          # `lake`, `lean` and `git`.
          export PATH="$GITHUB_WORKSPACE/landrun:$GITHUB_WORKSPACE/lean4export/.lake/build/bin:$GITHUB_WORKSPACE/nanoda_lib/target/release:$HOME/.elan/bin:$PATH"
          command -v landrun
          command -v lean4export
          command -v lake
          command -v nanoda_bin

          COMPARATOR_BIN="$GITHUB_WORKSPACE/comparator/.lake/build/bin/comparator"
          export COMPARATOR_BIN

          # The comparator README prescribes running the judge under
          #   systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pty \
          #     -E PATH="$PATH" --working-directory $(pwd) -- \
          #     bash -c 'lake env path/to/comparator Comparator/config.json'
          # to block AF_UNIX and so guard against the landrun escape fixed in Linux 7.1.
          # `systemd-run --user` needs a per-user systemd instance, which GitHub-hosted runners
          # do not provide, so we probe for it and otherwise fall back to the plain form (which
          # is what comparator's own CI uses). ON A MACHINE WITH SYSTEMD, ADD THE systemd-run
          # HARDENING BACK -- the plain form performs the full check minus that one mitigation.
          # comparator's README prescribes running the judge under
          #   systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pty \
          #     -E PATH="$PATH" --working-directory $(pwd) -- \
          #     bash -c 'lake env path/to/comparator Comparator/config.json'
          # to block AF_UNIX and so guard against the landrun escape fixed in Linux 7.1.
          # A run must never go green having applied strictly weaker sandboxing than the one
          # documented: missing hardening is fatal unless the operator explicitly opts out, and
          # the opt-out is recorded in the log.
          HARDEN=""
          if systemd-run --user --quiet --pipe --wait true >/dev/null 2>&1; then
            HARDEN="user"
            echo "AF_UNIX hardening: systemd-run --user"
          elif sudo -n systemd-run --uid="$(id -u)" --quiet --pipe --wait true >/dev/null 2>&1; then
            # System instance, still running the judge as the unprivileged user: comparator's
            # assumption 6 is "you are not running this under a privileged user".
            HARDEN="system"
            echo "AF_UNIX hardening: sudo systemd-run --uid=$(id -u)"
          elif [ "${{ inputs.allow_unhardened }}" = "true" ]; then
            echo "::warning::No systemd instance available; proceeding WITHOUT the AF_UNIX"\
                 "restriction because allow_unhardened was set. This run is NOT a full"\
                 "adversarial check."
          else
            echo "::error::Neither systemd-run --user nor sudo systemd-run is available, so the"\
                 "AF_UNIX restriction prescribed by comparator's README cannot be applied."\
                 "Refusing to report a green check under weaker sandboxing than documented."\
                 "Re-run via workflow_dispatch with allow_unhardened=true to override, or use a"\
                 "runner with systemd."
            exit 1
          fi

          failed=""
          for cfg in Comparator/config*.json; do
            echo "::group::comparator $cfg"
            case "$HARDEN" in
              user)
                systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pipe --wait \
                  -E PATH="$PATH" -E COMPARATOR_BIN="$COMPARATOR_BIN" -E CFG="$cfg" \
                  --working-directory "$(pwd)" -- \
                  bash -c 'lake env "$COMPARATOR_BIN" "$CFG"' || failed="$failed $cfg" ;;
              system)
                sudo systemd-run --property=RestrictAddressFamilies=~AF_UNIX --uid="$(id -u)" \
                  --pipe --wait -E PATH="$PATH" -E COMPARATOR_BIN="$COMPARATOR_BIN" -E CFG="$cfg" \
                  --working-directory "$(pwd)" -- \
                  bash -c 'lake env "$COMPARATOR_BIN" "$CFG"' || failed="$failed $cfg" ;;
              *)
                lake env "$COMPARATOR_BIN" "$cfg" || failed="$failed $cfg" ;;
            esac
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::comparator rejected:$failed"
            exit 1
          fi
          echo "comparator accepted all $(ls Comparator/config*.json | wc -l) entries"
